[project]
name = "transcript-tools"
version = "0.1.0"
description = "Clean meeting transcripts (Zoom / MS Stream) into captions and readable transcripts, with a project glossary and a guarded LLM polish."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PolicyEngine" }]
keywords = ["transcript", "captions", "subtitles", "vtt", "srt", "zoom", "youtube"]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[project.scripts]
clean-transcript = "transcript_tools.cli:main"

[project.urls]
Homepage = "https://github.com/PolicyEngine/transcript-tools"
Issues = "https://github.com/PolicyEngine/transcript-tools/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["transcript_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
